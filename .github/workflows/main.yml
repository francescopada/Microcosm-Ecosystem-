name: Setup and Build
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip update
        run: |
          unzip -oq Microcosm-update.zip -x ".github/*"
          rm -f *.zip
          rm -rf MicrobesMix
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Update Microcosm" || true
          git push
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: microcosm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$(date +%Y%m%d-%H%M)" \
            app/build/outputs/apk/debug/microcosm-debug.apk \
            --title "Microcosm" \
            --notes "Modern remake of the classic Microbes live wallpaper."
